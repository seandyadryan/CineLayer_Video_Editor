plugins { id 'com.android.application' }
def signingFile = rootProject.file('keystore.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'com.deploydulupulangnanti.cinelayer'
    compileSdk 36
    defaultConfig { applicationId 'com.deploydulupulangnanti.cinelayer'; minSdk 28; targetSdk 36; versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'com.deploydulupulangnanti.cinelayer.SmokeInstrumentation' }
    signingConfigs {
        release { if (signingFile.exists()) { storeFile file(signing['storeFile']); storePassword signing['storePassword']; keyAlias signing['keyAlias']; keyPassword signing['keyPassword'] } }
    }
    buildTypes { release { minifyEnabled false; if (signingFile.exists()) signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
